<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0e14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TVArg MicroApp</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-surface: #151b26;
      --bg-card: #1c2433;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.45);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    [tabindex="0"]:focus,
    button:focus {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
      transform: scale(1.05);
      box-shadow: 0 0 18px var(--accent-glow);
      z-index: 10;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 14, 20, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 16px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #041019;
      font-size: 0.72rem;
      font-weight: 900;
      padding: 3px 7px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: var(--bg-surface);
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      white-space: nowrap;
    }

    .btn-icon {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-icon:active {
      transform: scale(0.96);
    }

    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 6px 2px;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #06131f;
      border-color: var(--accent);
      font-weight: 700;
    }

    main {
      padding: 16px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (min-width: 640px) and (orientation: landscape), (min-width: 768px) {
      .channels-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
      }
    }

    @media (min-width: 1100px) {
      .channels-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
      }
    }

    .channel-card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: var(--radius);
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      position: relative;
      min-height: 138px;
    }

    .channel-card:hover {
      border-color: rgba(56, 189, 248, 0.5);
    }

    .channel-logo-wrap {
      width: 100%;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      padding: 6px;
    }

    .channel-logo {
      max-width: 85%;
      max-height: 56px;
      object-fit: contain;
    }

    .channel-fallback-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .channel-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .channel-meta {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text-secondary);
    }

    .proxy-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .player-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .player-modal.open {
      display: flex;
    }

    video#videoPlayer {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .player-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.82) 0%,
        transparent 28%,
        transparent 70%,
        rgba(0, 0, 0, 0.88) 100%
      );
      padding: 20px;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .player-overlay.hidden {
      opacity: 0;
    }

    .player-top,
    .player-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: auto;
    }

    .player-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .player-title {
      font-size: 1.25rem;
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .player-status {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: rgba(28, 36, 51, 0.88);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .ctrl-btn.danger {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.6);
    }

    .stream-alert {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 18px 24px;
      text-align: center;
      max-width: 88%;
      z-index: 110;
      display: none;
    }

    .stream-alert.visible {
      display: block;
    }

    .stream-alert p {
      font-size: 0.95rem;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .hint-bar {
      font-size: 0.78rem;
      color: var(--text-secondary);
      display: none;
    }

    @media (min-width: 768px) {
      .hint-bar {
        display: block;
      }
    }
  </style>
</head>
<body>

  <header id="appHeader">
    <div class="top-bar">
      <div class="brand">
        <span>TVArg</span>
        <span class="brand-badge">En Vivo</span>
      </div>
      <div class="header-actions">
        <span id="sourceStatus" class="status-pill">Iniciando...</span>
        <button id="btnReloadList" class="btn-icon" tabindex="0" title="Actualizar lista">↻ Actualizar</button>
      </div>
    </div>
    <nav id="categoriesBar" class="categories-bar" aria-label="Categorías de canales"></nav>
  </header>

  <main>
    <div id="channelsGrid" class="channels-grid" role="list"></div>
  </main>

  <section id="playerModal" class="player-modal" aria-label="Reproductor de TV">
    <video id="videoPlayer" playsinline autoplay></video>

    <div id="streamAlert" class="stream-alert">
      <p id="streamAlertText">Conectando señal...</p>
      <button id="btnRetryStream" class="ctrl-btn" tabindex="0">Reintentar ahora</button>
    </div>

    <div id="playerOverlay" class="player-overlay">
      <div class="player-top">
        <div class="player-info">
          <div id="playerTitle" class="player-title">Canal</div>
          <div id="playerStatus" class="player-status">Cargando transmisión...</div>
        </div>
        <button id="btnClosePlayer" class="ctrl-btn danger" tabindex="0">✕ Volver</button>
      </div>

      <div class="player-bottom">
        <div class="player-controls">
          <button id="btnPrevChannel" class="ctrl-btn" tabindex="0">▲ Anterior</button>
          <button id="btnNextChannel" class="ctrl-btn" tabindex="0">▼ Siguiente</button>
          <button id="btnMuteToggle" class="ctrl-btn" tabindex="0">🔊 Sonido</button>
        </div>
        <div class="hint-bar">D-Pad: ▲/▼ Zapping • OK Controles • Atrás Salir</div>
      </div>
    </div>
  </section>

  <script>
    const URL_CANALES_JSON = "https://raw.githubusercontent.com/GoVex95/GoVexTV/refs/heads/main/canales.json?token=GHSAT0AAAAAAERWNIIZ3BKWGFBGJ3UJJSGO2YFAKEQ";
    
    const PROXY_WORKER_URL = "https://tvarg-proxy.ejemplo.workers.dev";

    const FALLBACK_CHANNELS = [
      {
        nombre: "TV Pública",
        categoria: "Aire",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/TV_P%C3%BAblica_-_Logo_2021.svg/512px-TV_P%C3%BAblica_-_Logo_2021.svg.png",
        url: "https://cntlnk-main-edge-access.secure.footprint.net/entrypoint/c7_vivo01_dai_source-20001_all_1080p.m3u8",
        referer: "",
        ua: ""
      },
      {
        nombre: "TN (Todo Noticias)",
        categoria: "Noticias",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/TN_todo_noticias_logo.svg/512px-TN_todo_noticias_logo.svg.png",
        url: "https://live-01-02-tn.vodgc.net/TN24/index.m3u8",
        referer: "",
        ua: ""
      },
      {
        nombre: "C5N",
        categoria: "Noticias",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/C5N_logo.svg/512px-C5N_logo.svg.png",
        url: "https://live-01-01-c5n.vodgc.net/c5n/index.m3u8",
        referer: "",
        ua: ""
      },
      {
        nombre: "Crónica TV",
        categoria: "Noticias",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Cronica_TV_logo.svg/512px-Cronica_TV_logo.svg.png",
        url: "https://live-01-01-cronica.vodgc.net/cronica/index.m3u8",
        referer: "",
        ua: ""
      }
    ];

    const STORAGE_KEY = "tvarg_channels_cache_v1";
    const memoryStorage = {};
    let allChannels = [];
    let filteredChannels = [];
    let activeCategory = "Todos";
    let currentChannelIndex = -1;
    let hlsInstance = null;
    let overlayTimer = null;
    let reconnectTimer = null;
    let retryCount = 0;
    const MAX_RETRIES = 3;

    const elCategoriesBar = document.getElementById("categoriesBar");
    const elChannelsGrid = document.getElementById("channelsGrid");
    const elSourceStatus = document.getElementById("sourceStatus");
    const elBtnReload = document.getElementById("btnReloadList");

    const elPlayerModal = document.getElementById("playerModal");
    const elVideo = document.getElementById("videoPlayer");
    const elPlayerOverlay = document.getElementById("playerOverlay");
    const elPlayerTitle = document.getElementById("playerTitle");
    const elPlayerStatus = document.getElementById("playerStatus");
    const elStreamAlert = document.getElementById("streamAlert");
    const elStreamAlertText = document.getElementById("streamAlertText");

    const elBtnClosePlayer = document.getElementById("btnClosePlayer");
    const elBtnPrev = document.getElementById("btnPrevChannel");
    const elBtnNext = document.getElementById("btnNextChannel");
    const elBtnMute = document.getElementById("btnMuteToggle");
    const elBtnRetry = document.getElementById("btnRetryStream");

    function safeGetItem(key) {
      try {
        return window.localStorage.getItem(key);
      } catch (_) {
        return Object.prototype.hasOwnProperty.call(memoryStorage, key)
          ? memoryStorage[key]
          : null;
      }
    }

    function safeSetItem(key, value) {
      memoryStorage[key] = value;
      try {
        window.localStorage.setItem(key, value);
      } catch (_) {}
    }

    async function loadChannels(forceNetwork = false) {
      elSourceStatus.textContent = "Actualizando...";

      try {
        const cacheBuster = forceNetwork ? `?t=${Date.now()}` : "";
        const response = await fetch(URL_CANALES_JSON + cacheBuster, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        if (!Array.isArray(data) || data.length === 0) {
          throw new Error("JSON vacío o formato inválido");
        }

        const sanitized = sanitizeChannels(data);
        safeSetItem(STORAGE_KEY, JSON.stringify(sanitized));
        allChannels = sanitized;
        elSourceStatus.textContent = `Online (${allChannels.length})`;
      } catch (err) {
        const cachedRaw = safeGetItem(STORAGE_KEY);
        if (cachedRaw) {
          try {
            const parsedCache = JSON.parse(cachedRaw);
            if (Array.isArray(parsedCache) && parsedCache.length > 0) {
              allChannels = sanitizeChannels(parsedCache);
              elSourceStatus.textContent = `Caché local (${allChannels.length})`;
            } else {
              throw new Error("Caché corrupta");
            }
          } catch (_) {
            allChannels = sanitizeChannels(FALLBACK_CHANNELS);
            elSourceStatus.textContent = `Respaldo (${allChannels.length})`;
          }
        } else {
          allChannels = sanitizeChannels(FALLBACK_CHANNELS);
          elSourceStatus.textContent = `Respaldo (${allChannels.length})`;
        }
      }

      renderCategories();
      applyCategoryFilter(activeCategory);
    }

    function sanitizeChannels(list) {
      return list
        .filter(item => item && typeof item.nombre === "string" && typeof item.url === "string" && item.url.trim() !== "")
        .map(item => ({
          nombre: item.nombre.trim(),
          categoria: (item.categoria || "General").trim(),
          logo: (item.logo || "").trim(),
          url: item.url.trim(),
          referer: (item.referer || "").trim(),
          ua: (item.ua || "").trim()
        }));
    }

    function renderCategories() {
      const uniqueCats = ["Todos", ...new Set(allChannels.map(c => c.categoria))];
      if (!uniqueCats.includes(activeCategory)) {
        activeCategory = "Todos";
      }

      elCategoriesBar.innerHTML = "";
      uniqueCats.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "cat-btn" + (cat === activeCategory ? " active" : "");
        btn.textContent = cat;
        btn.setAttribute("tabindex", "0");
        btn.addEventListener("click", () => applyCategoryFilter(cat));
        elCategoriesBar.appendChild(btn);
      });
    }

    function applyCategoryFilter(category) {
      activeCategory = category;
      document.querySelectorAll(".cat-btn").forEach(btn => {
        btn.classList.toggle("active", btn.textContent === category);
      });

      filteredChannels = category === "Todos"
        ? [...allChannels]
        : allChannels.filter(c => c.categoria === category);

      renderChannelsGrid();
    }

    function renderChannelsGrid() {
      elChannelsGrid.innerHTML = "";

      filteredChannels.forEach((channel, idx) => {
        const card = document.createElement("div");
        card.className = "channel-card";
        card.setAttribute("tabindex", "0");
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `Ver ${channel.nombre}`);

        const logoWrap = document.createElement("div");
        logoWrap.className = "channel-logo-wrap";

        if (channel.logo) {
          const img = document.createElement("img");
          img.className = "channel-logo";
          img.src = channel.logo;
          img.alt = channel.nombre;
          img.loading = "lazy";
          img.onerror = () => {
            logoWrap.innerHTML = `<div class="channel-fallback-icon">${getInitials(channel.nombre)}</div>`;
          };
          logoWrap.appendChild(img);
        } else {
          logoWrap.innerHTML = `<div class="channel-fallback-icon">${getInitials(channel.nombre)}</div>`;
        }

        const nameEl = document.createElement("div");
        nameEl.className = "channel-name";
        nameEl.textContent = channel.nombre;

        const metaEl = document.createElement("div");
        metaEl.className = "channel-meta";
        const usesProxy = Boolean((channel.referer || channel.ua) && PROXY_WORKER_URL);
        metaEl.innerHTML = `<span>${channel.categoria}</span>${usesProxy ? '<span class="proxy-dot" title="Vía Proxy"></span>' : ''}`;

        card.appendChild(logoWrap);
        card.appendChild(nameEl);
        card.appendChild(metaEl);

        card.addEventListener("click", () => openPlayer(idx));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openPlayer(idx);
          }
        });

        elChannelsGrid.appendChild(card);
      });

      const firstCard = elChannelsGrid.querySelector(".channel-card");
      if (firstCard && !elPlayerModal.classList.contains("open")) {
        firstCard.focus();
      }
    }

    function getInitials(name) {
      return name
        .split(" ")
        .slice(0, 2)
        .map(w => w[0])
        .join("")
        .toUpperCase() || "TV";
    }

    function resolveStreamUrl(channel) {
      const hasReferer = channel.referer && channel.referer.length > 0;
      const hasUa = channel.ua && channel.ua.length > 0;
      const hasWorker = typeof PROXY_WORKER_URL === "string" && PROXY_WORKER_URL.trim().startsWith("http");

      if (!hasReferer && !hasUa) {
        return { url: channel.url, viaProxy: false };
      }

      if (hasWorker) {
        const cleanWorker = PROXY_WORKER_URL.replace(/\/+$/, "");
        let proxyUrl = `${cleanWorker}?url=${encodeURIComponent(channel.url)}`;
        if (hasReferer) {
          proxyUrl += `&referer=${encodeURIComponent(channel.referer)}`;
        }
        if (hasUa) {
          proxyUrl += `&ua=${encodeURIComponent(channel.ua)}`;
        }
        return { url: proxyUrl, viaProxy: true };
      }

      return { url: channel.url, viaProxy: false };
    }

    function openPlayer(index) {
      if (index < 0 || index >= filteredChannels.length) return;
      currentChannelIndex = index;
      retryCount = 0;

      elPlayerModal.classList.add("open");
      history.pushState({ playerOpen: true }, "");
      showOverlay();
      elBtnClosePlayer.focus();

      playChannel(filteredChannels[currentChannelIndex]);
    }

    function playChannel(channel) {
      cleanupPlayer();
      hideAlert();

      const { url: streamUrl, viaProxy } = resolveStreamUrl(channel);
      elPlayerTitle.textContent = channel.nombre;
      elPlayerStatus.textContent = viaProxy
        ? `Conectando señal (Proxy)...`
        : `Conectando señal directa...`;

      if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30,
          manifestLoadingTimeOut: 12000,
          manifestLoadingMaxRetry: 2,
          levelLoadingTimeOut: 12000,
          fragLoadingTimeOut: 15000
        });

        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(elVideo);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          retryCount = 0;
          elPlayerStatus.textContent = viaProxy ? "● En vivo (Proxy)" : "● En vivo";
          elVideo.play().catch(() => {
            elPlayerStatus.textContent = "Tocá la pantalla o presioná OK para reproducir";
          });
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            handleStreamFailure(channel, data.type);
          }
        });
      } else if (elVideo.canPlayType("application/vnd.apple.mpegurl")) {
        elVideo.src = streamUrl;
        elVideo.addEventListener("loadedmetadata", onNativeLoaded, { once: true });
        elVideo.addEventListener("error", onNativeError, { once: true });
      } else {
        showAlert("Tu navegador o WebView no soporta reproducción HLS (.m3u8).");
      }
    }

    function onNativeLoaded() {
      retryCount = 0;
      elPlayerStatus.textContent = "● En vivo (Nativo)";
      elVideo.play().catch(() => {});
    }

    function onNativeError() {
      if (currentChannelIndex >= 0 && filteredChannels[currentChannelIndex]) {
        handleStreamFailure(filteredChannels[currentChannelIndex], "NATIVE_ERROR");
      }
    }

    function handleStreamFailure(channel, errorType) {
      if (retryCount < MAX_RETRIES) {
        retryCount++;
        const delaySec = retryCount * 2;
        elPlayerStatus.textContent = `Señal inestable. Reintentando (${retryCount}/${MAX_RETRIES})...`;
        showAlert(`Señal interrumpida (${errorType}). Reconectando en ${delaySec}s...`);

        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => {
          if (elPlayerModal.classList.contains("open")) {
            playChannel(channel);
          }
        }, delaySec * 1000);
      } else {
        elPlayerStatus.textContent = "Señal fuera de línea";
        showAlert(`No se pudo cargar "${channel.nombre}". La transmisión puede estar caída o bloqueada por región.`);
        elBtnRetry.focus();
      }
    }

    function cleanupPlayer() {
      clearTimeout(reconnectTimer);
      elVideo.removeEventListener("loadedmetadata", onNativeLoaded);
      elVideo.removeEventListener("error", onNativeError);

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      elVideo.pause();
      elVideo.removeAttribute("src");
      elVideo.load();
    }

    function closePlayer(fromPopState = false) {
      if (!elPlayerModal.classList.contains("open")) return;
      cleanupPlayer();
      hideAlert();
      elPlayerModal.classList.remove("open");

      if (!fromPopState && history.state && history.state.playerOpen) {
        history.back();
      }

      const cards = elChannelsGrid.querySelectorAll(".channel-card");
      if (cards[currentChannelIndex]) {
        cards[currentChannelIndex].focus();
      }
      currentChannelIndex = -1;
    }

    function zapChannel(delta) {
      if (filteredChannels.length === 0) return;
      retryCount = 0;
      currentChannelIndex = (currentChannelIndex + delta + filteredChannels.length) % filteredChannels.length;
      showOverlay();
      playChannel(filteredChannels[currentChannelIndex]);
    }

    function showOverlay() {
      elPlayerOverlay.classList.remove("hidden");
      clearTimeout(overlayTimer);
      overlayTimer = setTimeout(() => {
        if (!elStreamAlert.classList.contains("visible")) {
          elPlayerOverlay.classList.add("hidden");
        }
      }, 4500);
    }

    function toggleOverlay() {
      if (elPlayerOverlay.classList.contains("hidden")) {
        showOverlay();
      } else {
        elPlayerOverlay.classList.add("hidden");
      }
    }

    function showAlert(msg) {
      elStreamAlertText.textContent = msg;
      elStreamAlert.classList.add("visible");
      showOverlay();
    }

    function hideAlert() {
      elStreamAlert.classList.remove("visible");
    }

    function toggleMute() {
      elVideo.muted = !elVideo.muted;
      elBtnMute.textContent = elVideo.muted ? "🔇 Silenciado" : "🔊 Sonido";
      showOverlay();
    }

    elBtnReload.addEventListener("click", () => loadChannels(true));
    elBtnClosePlayer.addEventListener("click", () => closePlayer(false));
    elBtnPrev.addEventListener("click", () => zapChannel(-1));
    elBtnNext.addEventListener("click", () => zapChannel(1));
    elBtnMute.addEventListener("click", toggleMute);
    elBtnRetry.addEventListener("click", () => {
      retryCount = 0;
      if (currentChannelIndex >= 0) {
        playChannel(filteredChannels[currentChannelIndex]);
      }
    });

    elVideo.addEventListener("click", () => {
      if (elVideo.paused) {
        elVideo.play().catch(() => {});
      }
      toggleOverlay();
    });

    window.addEventListener("popstate", () => {
      if (elPlayerModal.classList.contains("open")) {
        closePlayer(true);
      }
    });

    document.addEventListener("keydown", (e) => {
      const isPlayerOpen = elPlayerModal.classList.contains("open");

      if (isPlayerOpen) {
        showOverlay();

        switch (e.key) {
          case "Escape":
          case "Backspace":
          case "BrowserBack":
            e.preventDefault();
            closePlayer(false);
            break;

          case "ArrowUp":
          case "ChannelUp":
            e.preventDefault();
            zapChannel(-1);
            break;

          case "ArrowDown":
          case "ChannelDown":
            e.preventDefault();
            zapChannel(1);
            break;

          case "MediaPlayPause":
            e.preventDefault();
            if (elVideo.paused) elVideo.play().catch(() => {});
            else elVideo.pause();
            break;

          case "AudioVolumeMute":
          case "m":
          case "M":
            e.preventDefault();
            toggleMute();
            break;
        }
        return;
      }

      const activeEl = document.activeElement;
      if (!activeEl || !activeEl.classList.contains("channel-card")) return;

      const cards = Array.from(elChannelsGrid.querySelectorAll(".channel-card"));
      const idx = cards.indexOf(activeEl);
      if (idx === -1) return;

      const cols = getGridColumnCount();

      if (e.key === "ArrowRight" && idx + 1 < cards.length) {
        e.preventDefault();
        cards[idx + 1].focus();
      } else if (e.key === "ArrowLeft" && idx - 1 >= 0) {
        e.preventDefault();
        cards[idx - 1].focus();
      } else if (e.key === "ArrowDown" && idx + cols < cards.length) {
        e.preventDefault();
        cards[idx + cols].focus();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (idx - cols >= 0) {
          cards[idx - cols].focus();
        } else {
          const activeCatBtn = elCategoriesBar.querySelector(".cat-btn.active");
          if (activeCatBtn) activeCatBtn.focus();
        }
      }
    });

    function getGridColumnCount() {
      const style = window.getComputedStyle(elChannelsGrid);
      const cols = style.getPropertyValue("grid-template-columns").split(" ").length;
      return cols || 2;
    }

    loadChannels(false);
  </script>
</body>
</html>
