<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f17" />
  <title>GoVexTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #090d14;
      --surface: #121824;
      --surface-hover: #1b2538;
      --border: #232f45;
      --text: #f3f6fc;
      --muted: #93a1b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.38);
      --danger: #ef4444;
      --vlc: #f97316;
      --wvc: #0ea5e9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(9, 13, 20, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .badge {
      background: var(--accent);
      color: #05131f;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 440px;
      min-width: 200px;
    }

    input[type="text"], select {
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.9rem;
      width: 100%;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    button {
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    button:hover,
    button:focus-visible,
    .media-card:hover,
    .media-card:focus-visible {
      outline: none;
      border-color: var(--accent);
      background: var(--surface-hover);
      box-shadow: 0 0 0 3px var(--accent-glow);
      transform: scale(1.03);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      white-space: nowrap;
      border-radius: 999px;
      padding: 7px 15px;
      font-size: 0.86rem;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #05131f;
      border-color: var(--accent);
      font-weight: 800;
    }

    main {
      padding: 16px 16px 48px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text);
    }

    .status-pill {
      font-size: 0.76rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 999px;
    }

    .grid-vod {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 14px;
    }

    .grid-tv {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    @media (min-width: 900px) {
      .grid-vod {
        grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
        gap: 18px;
      }
      .grid-tv {
        grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
        gap: 18px;
      }
    }

    .media-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #0e1420;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rating-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(9, 13, 20, 0.85);
      color: #fbbf24;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
      border: 1px solid rgba(251, 191, 36, 0.35);
    }

    .type-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(56, 189, 248, 0.9);
      color: #05131f;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
      text-transform: uppercase;
    }

    .card-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-sub {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .tv-card-inner {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      min-height: 138px;
    }

    .logo-box {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: #090d14;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px;
    }

    .logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .logo-fallback {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
    }

    /* Modales */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(5, 8, 14, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .detail-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 760px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .detail-top {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .detail-poster {
      width: 115px;
      border-radius: 12px;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      background: #090d14;
      flex-shrink: 0;
    }

    @media (min-width: 640px) {
      .detail-poster { width: 155px; }
    }

    .detail-meta {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .detail-title {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .detail-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
    }

    .detail-overview {
      font-size: 0.88rem;
      line-height: 1.45;
      color: var(--muted);
    }

    .tv-controls-box {
      background: #0c111c;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .selectors-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-wvc {
      border-color: rgba(14, 165, 233, 0.7);
      background: rgba(14, 165, 233, 0.2);
    }

    .btn-vlc {
      border-color: rgba(249, 115, 22, 0.7);
      background: rgba(249, 115, 22, 0.2);
    }

    .btn-danger {
      border-color: rgba(239, 68, 68, 0.65);
      background: rgba(239, 68, 68, 0.18);
    }

    /* Reproductor TV en Vivo */
    .player-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: #000;
      display: none;
      flex-direction: column;
    }

    .player-modal.open {
      display: flex;
    }

    .player-overlay-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 70;
      padding: 16px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .player-overlay-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 70;
      padding: 18px 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.92), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .video-wrap {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .player-message {
      position: absolute;
      z-index: 65;
      background: rgba(18, 24, 36, 0.95);
      border: 1px solid var(--border);
      padding: 18px 22px;
      border-radius: 14px;
      text-align: center;
      max-width: 90%;
      display: none;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .player-message.visible {
      display: flex;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="brand">
        <h1>GoVexTV</h1>
        <span class="badge">Stream</span>
      </div>

      <div class="search-box">
        <input id="searchInput" type="text" placeholder="Buscar película o serie..." aria-label="Buscar" />
        <button id="btnSearch" type="button">🔍</button>
      </div>
    </div>

    <nav class="nav-tabs" aria-label="Secciones">
      <button class="tab-btn active" data-tab="trending" type="button">🔥 Tendencias</button>
      <button class="tab-btn" data-tab="movies" type="button">🎬 Películas</button>
      <button class="tab-btn" data-tab="series" type="button">📺 Series</button>
      <button class="tab-btn" data-tab="livetv" type="button">📡 TV en Vivo</button>
    </nav>
  </header>

  <main>
    <div class="section-header">
      <h2 id="sectionTitle" class="section-title">Tendencias de la semana</h2>
      <span id="statusPill" class="status-pill">Conectando TMDB...</span>
    </div>

    <div id="contentGrid" class="grid-vod"></div>
    <div id="emptyState" class="empty-state" style="display:none;"></div>
  </main>

  <!-- Modal Detalle Película / Serie -->
  <div id="detailModal" class="modal-backdrop" aria-hidden="true">
    <div class="detail-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span id="detailTypeBadge" class="badge">Película</span>
        <button id="btnCloseDetail" class="btn-danger" type="button">✕ Cerrar</button>
      </div>

      <div class="detail-top">
        <img id="detailPoster" class="detail-poster" src="" alt="Poster" />
        <div class="detail-meta">
          <h3 id="detailTitle" class="detail-title">Título</h3>
          <div id="detailBadges" class="detail-badges"></div>
          <p id="detailOverview" class="detail-overview"></p>
        </div>
      </div>

      <div id="seriesControls" class="tv-controls-box" style="display:none;">
        <div style="font-size:0.85rem; font-weight:700; color:var(--accent);">Seleccionar episodio:</div>
        <div class="selectors-row">
          <select id="seasonSelect" aria-label="Temporada"></select>
          <select id="episodeSelect" aria-label="Episodio"></select>
        </div>
        <div id="episodeTitlePreview" style="font-size:0.82rem; color:var(--muted);"></div>
      </div>

      <div class="tv-controls-box">
        <div style="font-size:0.85rem; font-weight:700;">Buscar y reproducir fuente:</div>
        <div class="actions-row">
          <button id="btnSendWvcSearch" class="btn-wvc" type="button">📺 Abrir búsqueda en Web Video Caster</button>
          <button id="btnWebSearch" type="button">🌐 Buscar fuente en navegador</button>
        </div>
        <div style="font-size:0.78rem; color:var(--muted);">
          Tip: En Web Video Caster se abre la búsqueda lista para detectar el video y enviarlo directo a tu Android TV.
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Reproductor TV en Vivo -->
  <div id="playerModal" class="player-modal" aria-hidden="true">
    <div class="player-overlay-top">
      <div>
        <div id="npTitle" style="font-size:1.1rem; font-weight:800;">Canal</div>
        <div id="npSub" style="font-size:0.8rem; color:var(--accent);">Conectando...</div>
      </div>
      <button id="btnClosePlayer" class="
